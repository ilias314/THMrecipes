<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipes - Recipe App</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" />
  <!-- Styles -->
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#" onclick="redirectHome()">THM Recipes</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="recipes.html">Recipes</a></li>
        <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
        <!-- Dark Mode Toggle Button -->
        <li class="nav-item">
          <button class="btn btn-sm btn-outline-light ms-3" id="darkModeBtn" onclick="toggleDarkMode()">
            <i id="darkModeIcon" class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container" style="margin-top:60px;">
  <div class="row align-items-center mb-4">
    <div class="col-md-6">
      <h2 class="mb-0 text-center text-md-start">Recipes</h2>
    </div>
    <div class="col-md-6 text-md-end mt-3 mt-md-0">
      <a href="add-recipe.html" class="btn btn-success">
        <i class="fas fa-plus-circle me-2"></i> Add Recipe
      </a>
    </div>
  </div>
  <div class="row" id="recipesList">
    <!-- Recipe cards -->
  </div>
  <!-- Pagination Container -->
  <div id="pagination-container" class="minimalist-pagination d-flex justify-content-center align-items-center my-2">
    <button id="prevPage" class="btn minimalist-btn me-2" disabled>
      <i class="fas fa-chevron-left"></i>
    </button>
    <span id="pageInfo" class="minimalist-info">Page 1 of X</span>
    <button id="nextPage" class="btn minimalist-btn ms-2">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>

<!-- Edit Recipe Modal -->
<div class="modal fade" id="editRecipeModal" tabindex="-1" aria-labelledby="editRecipeModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header custom-card-header">
        <h5 class="modal-title" id="editRecipeModalLabel">Edit Recipe</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editRecipeForm">
          <div class="mb-3">
            <label for="recipeTitleInput" class="form-label">Title</label>
            <input type="text" class="form-control" id="recipeTitleInput" required />
          </div>
          <div class="mb-3">
            <label for="recipeDescriptionInput" class="form-label">Description</label>
            <textarea class="form-control" id="recipeDescriptionInput" rows="2" required></textarea>
          </div>
          <div class="mb-3">
            <label for="recipeIngredientsInput" class="form-label">Ingredients (comma separated)</label>
            <textarea class="form-control" id="recipeIngredientsInput" rows="2" required></textarea>
          </div>
          <div class="mb-3">
            <label for="recipeInstructionsInput" class="form-label">Instructions (comma separated)</label>
            <textarea class="form-control" id="recipeInstructionsInput" rows="4" required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="updateRecipeFromModal()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header custom-card-header">
        <h5 class="modal-title" id="confirmationModalLabel">Please Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="confirmationMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="confirmButton" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- Custom Toast Container -->
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

<!-- Footer -->
<footer>
  <p class="mb-0 text-center">&copy; 2025 Recipe App. All rights reserved.</p>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/recipes.js"></script>
<script src="../js/auth.js"></script>
<script>
  // Global Confirmation Dialog Helper
  function showConfirmationDialog(message, onConfirm) {
    const modalElement = document.getElementById('confirmationModal');
    const messageElement = document.getElementById('confirmationMessage');
    const confirmButton = document.getElementById('confirmButton');
    messageElement.textContent = message;
    const newConfirmButton = confirmButton.cloneNode(true);
    confirmButton.parentNode.replaceChild(newConfirmButton, confirmButton);
    newConfirmButton.addEventListener('click', () => {
      const modalInstance = bootstrap.Modal.getInstance(modalElement);
      modalInstance.hide();
      onConfirm();
    });
    const confirmationModal = new bootstrap.Modal(modalElement);
    confirmationModal.show();
  }

  // Global Toast Function
  function showCustomToast(message, type = "success") {
    const container = document.getElementById("toastContainer");
    if (!container) return;
    const toast = document.createElement("div");
    toast.classList.add("toast-custom", type);
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 100);
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => container.removeChild(toast), 500);
    }, 3000);
  }
</script>
</body>
</html>
