<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe - Recipe App</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="logo.png" alt="Recipe App Logo" width="40" height="40" class="d-inline-block align-top">
      Recipe App
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="recipes.html">Recipes</a>
      <a class="nav-link" href="profile.html">Profile</a>
      <a class="nav-link" href="#" onclick="logout()">Logout</a>
    </div>
  </div>
</nav>

<!-- Add Recipe Form -->
<div class="container" style="margin-top: 100px;">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header custom-card-header text-center">
          <h4>Add New Recipe</h4>
        </div>
        <div class="card-body">
          <form id="addRecipeForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control" placeholder="Enter recipe title" required>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="3" placeholder="Enter a short description" required></textarea>
            </div>
            <div class="mb-3">
              <label for="ingredients" class="form-label">Ingredients</label>
              <textarea id="ingredients" class="form-control" rows="4" placeholder="List ingredients (separated by commas)" required></textarea>
            </div>
            <div class="mb-3">
              <label for="instructions" class="form-label">Instructions</label>
              <textarea id="instructions" class="form-control" rows="6" placeholder="Enter step-by-step instructions" required></textarea>
            </div>
            <div class="mb-3">
              <label for="imageUpload" class="form-label">Recipe Image</label>
              <input type="file" id="imageUpload" class="form-control" accept="image/*" required>
            </div>
            <!-- Add Recipe and Back to Recipes Buttons -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Add Recipe</button>
              <a href="recipes.html" class="btn btn-secondary">Back to Recipes</a>
            </div>
          </form>
          <p id="message" class="mt-3 text-center"></p>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Toast Notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Recipe App</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body"></div>
  </div>
</div>

<!-- Footer (using unified footer styling from styles.css) -->
<footer>
  <p>&copy; 2023 Recipe App. All rights reserved.</p>
  <div>
    <a href="#" class="text-white me-3"><i class="fab fa-facebook"></i></a>
    <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
    <a href="#" class="text-white"><i class="fab fa-instagram"></i></a>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="add-recipe.js"></script>
<script src="auth.js"></script>
</body>
</html>
