<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="register.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="text-center">
<div class="container mt-5">
    <h2>Registrieren</h2>
    <input type="text" id="username" class="form-control mb-2" placeholder="Benutzername">
    <input type="email" id="email" class="form-control mb-2" placeholder="E-Mail">
    <input type="password" id="password" class="form-control mb-2" placeholder="Passwort">
    <button onclick="register()" class="btn btn-primary">Registrieren</button>
    <p class="mt-3">Schon ein Konto? <a href="login.html">Hier anmelden</a></p>
    <p id="message" class="mt-2 text-danger"></p>
</div>
</body>
</html>
