<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - Recipe App</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <!-- Font Awesome (for icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" />
  <!-- Your main stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- Responsive Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#" onclick="redirectHome()">THM Recipes</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarProfile"
            aria-controls="navbarProfile" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarProfile">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="recipes.html">Recipes</a></li>
        <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="profile.html">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
        <!-- Dark Mode Toggle -->
        <li class="nav-item">
          <button class="btn btn-sm btn-outline-light ms-3" id="darkModeBtn" onclick="toggleDarkMode()">
            <i id="darkModeIcon" class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container" style="margin-top:60px;">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header custom-card-header text-center">
          <h4>Profile</h4>
        </div>
        <div class="card-body">
          <!-- Profile Information -->
          <div id="profileInfo"></div>

          <!-- Edit and Delete Profile Buttons -->
          <div class="mt-3">
            <button class="btn btn-primary" onclick="openEditProfileModal()">Edit Profile</button>
            <button class="btn btn-danger" onclick="deleteProfile()">Delete Profile</button>
          </div>

          <!-- User Recipes -->
          <h3 class="mt-4">Your Recipes</h3>
          <div class="row" id="userRecipes"></div>

          <!-- User Comments -->
          <h3 class="mt-4">Your Comments</h3>
          <div id="userComments"></div>

          <!-- User Ratings -->
          <h3 class="mt-4">Your Ratings</h3>
          <div id="userRatings"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header custom-card-header">
        <h5 class="modal-title" id="editProfileModalLabel">Edit Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editProfileForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">New Password</label>
            <input type="password" class="form-control" id="password" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="updateProfile()">Save changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

<!-- Footer -->
<footer>
  <p class="mb-0">&copy; 2025 Recipe App. All rights reserved.</p>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="profile.js"></script>
<script src="auth.js"></script>
<!-- Our dark mode logic -->
<script src="dark-mode.js"></script>
</body>
</html>
