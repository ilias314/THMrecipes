<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Recipe App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-image full-page">
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#" onclick="redirectHome()">THM Recipes</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="login.html">Login</a>
    </div>
  </div>
</nav>

<!-- Register Form -->
<div class="content">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header custom-card-header text-center">
            <h4>Register</h4>
          </div>
          <div class="card-body">
            <form id="registerForm">
              <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" class="form-control" required />
              </div>
              <div class="d-grid">
                <button type="button" id="registerButton" class="btn btn-primary" onclick="register()">Register</button>
              </div>
            </form>
            <p id="message" class="mt-3 text-center"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Global Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header custom-card-header">
        <h5 class="modal-title" id="confirmationModalLabel">Please Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="confirmationMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="confirmButton" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>
</div>


<!-- Footer -->
<footer>
  <p class="mb-0">&copy; 2025 Recipe App. All rights reserved.</p>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/register.js"></script>
</body>
</html>
