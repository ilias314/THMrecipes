<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe - Recipe App</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Your main styles -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<!-- Responsive Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="recipes.html" onclick="redirectHome()">THM Recipes</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAddRecipe" aria-controls="navbarAddRecipe" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarAddRecipe">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="recipes.html">Recipes</a></li>
        <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
        <!-- Dark Mode Toggle -->
        <li class="nav-item">
          <button class="btn btn-sm btn-outline-light ms-3" id="darkModeBtn" onclick="toggleDarkMode()">
            <i id="darkModeIcon" class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Add Recipe Form -->
<div class="container" style="margin-top: 100px;">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header custom-card-header text-center">
          <h4>Add New Recipe</h4>
        </div>
        <div class="card-body">
          <form id="addRecipeForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control" placeholder="Enter recipe title" required>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="3" placeholder="Enter a short description" required></textarea>
            </div>
            <div class="mb-3">
              <label for="ingredients" class="form-label">Ingredients</label>
              <textarea id="ingredients" class="form-control" rows="4" placeholder="List ingredients (separated by commas)" required></textarea>
            </div>
            <div class="mb-3">
              <label for="instructions" class="form-label">Instructions</label>
              <textarea id="instructions" class="form-control" rows="6" placeholder="Enter step-by-step instructions" required></textarea>
            </div>
            <div class="mb-3">
              <label for="imageUpload" class="form-label">Recipe Image</label>
              <input type="file" id="imageUpload" class="form-control" accept="image/*" required>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Add Recipe</button>
              <a href="recipes.html" class="btn btn-secondary">Back to Recipes</a>
            </div>
          </form>
          <p id="message" class="mt-3 text-center"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer>
  <p>&copy; 2025 Recipe App. All rights reserved.</p>
  <div>
    <a href="#" class="text-white me-3"><i class="fab fa-facebook"></i></a>
    <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
    <a href="#" class="text-white"><i class="fab fa-instagram"></i></a>
  </div>
</footer>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/add-recipe.js"></script>
<script src="../js/auth.js"></script>
<!--dark mode logic -->
<script src="../js/dark-mode.js"></script>
</body>
</html>
